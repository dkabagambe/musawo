services:
  - type: web
    name: musawo-web
    runtime: node
    region: frankfurt
    plan: free
    branch: main
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: staging
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: DEMO_MODE
        value: "true"
      - key: AUTH_SECRET
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: EMAIL_FROM
        value: "Musawo Training Center <noreply@musawotraining.ug>"
      - key: AT_USERNAME
        value: sandbox
      - key: AT_SENDER_ID
        value: MUSAWO
      - key: PESAPAL_BASE_URL
        value: https://cybqa.pesapal.com/pesapalv3
      - key: PESAPAL_WEBHOOK_SECRET
        generateValue: true
      - key: FLUTTERWAVE_WEBHOOK_SECRET
        generateValue: true
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        value: mtc-files
      - key: BUNNY_CDN_HOSTNAME
        value: iframe.mediadelivery.net
      - key: DATABASE_URL
        fromDatabase:
          name: musawo-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: musawo-redis
          property: connectionString

databases:
  - name: musawo-db
    databaseName: mtc_db
    user: mtc
    region: frankfurt
    plan: free

  - type: redis
    name: musawo-redis
    region: frankfurt
    plan: free
    ipAllowList: []
