services:
  - type: web
    name: musawo-web
    runtime: node
    region: frankfurt
    plan: free
    branch: main
    buildCommand: npm ci && npx prisma generate && SKIP_DB_MIGRATE=1 npx next build
    startCommand: npx prisma migrate resolve --rolled-back 20261102110000_section11_concurrency_indexes; npx prisma migrate deploy; npm start
    healthCheckPath: /api/health
    # Give the app 120 s to start before Render declares it unhealthy.
    # Cold start on free tier = migrate (~10s) + Next.js init (~15s) + DB warmup.
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: staging
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: DEMO_MODE
        value: "true"
      - key: AUTH_SECRET
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: EMAIL_FROM
        value: "Musawo Training Center <noreply@musawotraining.ug>"
      - key: AT_USERNAME
        value: sandbox
      - key: AT_SENDER_ID
        value: MUSAWO
      - key: PESAPAL_BASE_URL
        value: https://cybqa.pesapal.com/pesapalv3
      - key: PESAPAL_WEBHOOK_SECRET
        generateValue: true
      - key: FLUTTERWAVE_WEBHOOK_SECRET
        generateValue: true
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        value: mtc-files
      - key: BUNNY_CDN_HOSTNAME
        value: iframe.mediadelivery.net
      - key: DATABASE_URL
        fromDatabase:
          name: musawo-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: musawo-redis
          property: connectionString
      # Public URL used in emails and OG tags — update to your custom domain when set
      - key: NEXT_PUBLIC_SITE_URL
        value: https://musawo-web.onrender.com

  - type: redis
    name: musawo-redis
    region: frankfurt
    plan: free
    ipAllowList: []

  # ── Keepalive pinger ──────────────────────────────────────────────────────
  # Render free-tier web services sleep after 15 minutes of inactivity,
  # causing a ~30 s cold start and a 502 for the first visitor.
  # This cron job pings /api/health every 10 minutes to keep the service warm.
  # It costs nothing — Render free cron jobs are free.
  - type: cron
    name: musawo-keepalive
    runtime: node
    region: frankfurt
    plan: free
    schedule: "*/10 * * * *"
    buildCommand: echo "keepalive"
    startCommand: >
      node -e "
        const https = require('https');
        const url = process.env.APP_URL || 'https://musawo-web.onrender.com';
        https.get(url + '/api/health', (r) => {
          console.log('keepalive ping:', r.statusCode, new Date().toISOString());
          r.resume();
        }).on('error', (e) => console.error('keepalive error:', e.message));
      "
    envVars:
      - key: APP_URL
        value: https://musawo-web.onrender.com

databases:
  - name: musawo-db
    databaseName: mtc_db
    user: mtc
    region: frankfurt
    plan: free
