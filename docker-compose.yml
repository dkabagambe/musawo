# Musawo Training Center — Docker Compose
#
# Production:  docker compose up -d
# Development: docker compose up -d postgres redis   (then run Next.js locally)
#
# PRODUCTION SECURITY NOTES:
#   - Set POSTGRES_PASSWORD to a long random value (openssl rand -base64 32).
#   - Remove or firewall the postgres/redis port mappings below.
#   - Never commit real secrets to version control.
#   - Docker Compose will refuse to start if POSTGRES_PASSWORD is empty.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public"
      REDIS_URL: redis://redis:6379
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://learn.musawotraining.ug}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      PESAPAL_CONSUMER_KEY: ${PESAPAL_CONSUMER_KEY:-}
      PESAPAL_CONSUMER_SECRET: ${PESAPAL_CONSUMER_SECRET:-}
      PESAPAL_IPN_ID: ${PESAPAL_IPN_ID:-}
      PESAPAL_BASE_URL: ${PESAPAL_BASE_URL:-https://pay.pesapal.com/v3}
      FLUTTERWAVE_SECRET_KEY: ${FLUTTERWAVE_SECRET_KEY:-}
      BUNNY_STREAM_API_KEY: ${BUNNY_STREAM_API_KEY:-}
      BUNNY_LIBRARY_ID: ${BUNNY_LIBRARY_ID:-}
      BUNNY_SIGNING_KEY: ${BUNNY_SIGNING_KEY:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-mtc-files}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-MTC <noreply@musawotraining.ug>}
      AT_API_KEY: ${AT_API_KEY:-}
      AT_USERNAME: ${AT_USERNAME:-sandbox}
      AT_SENDER_ID: ${AT_SENDER_ID:-MUSAWO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - mtc_internal

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env — use a long random value in production}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Expose to host for local development (prisma migrate, db seed, Prisma Studio).
    # In production: remove this port mapping and firewall port 5432.
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mtc} -d ${POSTGRES_DB:-mtc_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mtc_internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    # Expose to host for local development.
    # In production: remove this port mapping and firewall port 6379.
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mtc_internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - mtc_internal

  # Nightly backup job
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-mtc-files}
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
    entrypoint: ["sh", "-c", "echo '0 2 * * * /backup.sh' | crontab - && crond -f"]
    depends_on:
      - postgres
    networks:
      - mtc_internal

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  mtc_internal:
    driver: bridge
